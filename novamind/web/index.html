<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaMind AGI - Localhost</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --container-bg: rgba(255, 255, 255, 0.03);
            --text-color: #e2e8f0;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --blur: blur(12px);
        }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15), transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15), transparent 25%);
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .chat-container {
            width: 100%;
            max-width: 650px;
            height: 85vh;
            background: var(--container-bg);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--accent);
            text-transform: uppercase;
        }
        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        /* SCROLLBAR CUSTOMIZADA */
        .messages::-webkit-scrollbar {
            width: 6px;
        }
        .messages::-webkit-scrollbar-track {
            background: transparent;
        }
        .messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
        }
        .messages::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        
        .msg {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
            word-wrap: break-word;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .msg.user {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.3);
            align-self: flex-end;
            border-bottom-right-radius: 0;
        }
        .msg.bot {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            align-self: flex-start;
            border-bottom-left-radius: 0;
            display: flex;
            flex-direction: column;
        }
        .bot .thought {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-bottom: 8px;
            font-style: italic;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 5px;
        }
        .bot .emit {
            color: #e2e8f0;
        }
        .input-area {
            padding: 20px;
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px 15px;
            border-radius: 10px;
            color: white;
            font-family: inherit;
            outline: none;
            transition: border 0.3s;
        }
        input:focus {
            border-color: var(--accent);
        }
        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }
        button:hover {
            background: var(--accent-hover);
        }
        .loading {
            font-size: 0.8rem;
            color: #94a3b8;
            align-self: flex-start;
            margin-left: 20px;
            display: none;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">🟢 NovaMind AGI (GPU Local)</div>
    <div class="messages" id="messages">
        <div class="msg bot"><span class="emit">GPU limit configurado. Todas as 7 camadas cognitivas integradas e rodando na API oficial via localhost. Pode me enviar uma mensagem.</span></div>
    </div>
    <div class="loading" id="loading">✨ NovaMind processando reflexões nas 7 camadas...</div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Envie algo para o AGI..." onkeypress="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()" id="sendBtn">Enviar</button>
    </div>
</div>

<script>
    const msgs = document.getElementById('messages');
    const loading = document.getElementById('loading');
    const input = document.getElementById('userInput');
    const btn = document.getElementById('sendBtn');
    
    async function sendMessage() {
        const text = input.value.trim();
        if(!text) return;
        
        msgs.innerHTML += `<div class="msg user">${text}</div>`;
        input.value = '';
        msgs.scrollTop = msgs.scrollHeight;
        
        loading.style.display = 'block';
        input.disabled = true;
        btn.disabled = true;
        
        try {
            // Chama a rota da API oficial do arquivo server.py do NovaMind
            const res = await fetch('/api/think', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({input: text})
            });
            const data = await res.json();
            
            loading.style.display = 'none';
            input.disabled = false;
            btn.disabled = false;
            input.focus();
            
            if (data.error) {
                msgs.innerHTML += `<div class="msg bot" style="color:#ef4444;">Erro da API: ${data.error}</div>`;
            } else {
                // Formata o texto final para HTML (convertendo quebras de linha Markdown e Asteriscos)
                let finalText = data.response.text || "Sem resposta...";
                finalText = finalText.replace(/\\n/g, '<br>');
                finalText = finalText.replace(/\\*\\*(.*?)\\*\\*/g, '<strong>$1</strong>');
                finalText = finalText.replace(/\\*(.*?)\\*/g, '<em>$1</em>');
                
                // Formata o Thought com um resumo do que aconteceu nas camadas
                const confidence = data.response.confidence ? Math.round(data.response.confidence * 100) + '%' : "N/A";
                let thoughtProcess = `[Ciclo cognitivo #${data.cycle} | Confiança: ${confidence}]<br>
                                      ➔ Aprendizado contínuo & Metacognição aplicados na memória.`;
                                      
                msgs.innerHTML += `
                    <div class="msg bot">
                        <span class="thought">${thoughtProcess}</span>
                        <span class="emit">${finalText}</span>
                    </div>
                `;
            }
            msgs.scrollTop = msgs.scrollHeight;
        } catch(e) {
            loading.style.display = 'none';
            input.disabled = false;
            btn.disabled = false;
            msgs.innerHTML += `<div class="msg bot" style="color:#ef4444;">Erro de conexão com o AGI NovaMind. Verifique o console.</div>`;
        }
    }
</script>

</body>
</html>
